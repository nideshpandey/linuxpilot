name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Smoke test the CLI
        run: |
          linuxpilot --version
          linuxpilot status --no-network --quick || test $? -le 2
          linuxpilot status --json --no-network --quick > out.json || test $? -le 2
          python -c "import json; json.load(open('out.json'))"
