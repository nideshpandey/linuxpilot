# Publishes to PyPI when you push a version tag like v0.1.0.
# Uses PyPI "Trusted Publishing" (no API token stored in GitHub):
#   1. Create the project on https://pypi.org/manage/account/publishing/
#      as a "pending publisher" with this repo, workflow "release.yml",
#      and environment "pypi".
#   2. Bump __version__ in src/linuxpilot/__init__.py, commit, tag, push:
#        git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Check tag matches package version
        run: |
          PKG=$(python -c "import linuxpilot; print(linuxpilot.__version__)")
          test "v$PKG" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != v$PKG"; exit 1; }
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
