[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "linuxpilot"
dynamic = ["version"]
description = "A lightweight, CLI-first health check for Linux servers and Raspberry Pi: explains what's wrong and what to check next."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nidesh Pandey" }]
keywords = ["linux", "monitoring", "health-check", "diagnostics", "raspberry-pi", "sysadmin", "homelab", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
linuxpilot = "linuxpilot.cli:main"

[project.urls]
Homepage = "https://github.com/nideshpandey/linuxpilot"
Issues = "https://github.com/nideshpandey/linuxpilot/issues"

[tool.setuptools.dynamic]
version = { attr = "linuxpilot.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
